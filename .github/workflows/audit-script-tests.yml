name: TFT unified audit tests

on:
  push:
    paths:
      - 'scripts/audit_viewer_match.py'
      - 'tests/test_purchase_sequence_audit.py'
      - 'tests/test_board_quality_audit.py'
      - 'tests/test_audit_metric_reconciliation.py'
      - '.github/workflows/audit-script-tests.yml'
  pull_request:
    paths:
      - 'scripts/audit_viewer_match.py'
      - 'tests/test_audit_metric_reconciliation.py'
      - 'tests/test_purchase_sequence_audit.py'
      - 'tests/test_board_quality_audit.py'
      - 'scripts/test_audit_viewer_match.py'
      - '.github/workflows/audit-script-tests.yml'

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile scripts/audit_viewer_match.py
      - name: Install pytest for audit unit tests
        run: python -m pip install pytest
      - name: Run audit regression tests
        run: |
          python -m pytest -q tests/test_audit_full_report.py tests/test_purchase_sequence_audit.py tests/test_board_quality_audit.py tests/test_audit_metric_reconciliation.py
